services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assessoria
      POSTGRES_PASSWORD: assessoria
      POSTGRES_DB: assessoria
    ports: ["5432:5432"]
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessoria"]
      interval: 5s
      timeout: 3s
      retries: 10

  # entra na Fase 2, junto com o worker de materialização de séries
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dados-postgres:
